name: Build and Deploy to Production VPS

# =============================================================================
# Flow:
#   1. build job  — Build JS, build Docker images, push to GHCR
#                   (VPS không cần build gì)
#   2. deploy job — Rsync config files, VPS chỉ docker pull + up
# =============================================================================

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/phucvu3008/koola-website-api
  IMAGE_WEB: ghcr.io/phucvu3008/koola-website-web

jobs:
  build:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Build API
        run: npm run build --workspace=apps/api

      - name: Build Next.js
        run: npm run build --workspace=apps/web
        env:
          NEXT_PUBLIC_API_BASE_URL: https://koola.vn/api
          NEXT_PUBLIC_SITE_URL: https://koola.vn
          API_BASE_URL_SERVER: http://localhost:4000
          NEXT_PUBLIC_GA_MEASUREMENT_ID: G-Q1HY3MEZPC

      - name: Create env file for Docker
        run: |
          {
            echo "NODE_ENV=production"
            echo "NEXT_PUBLIC_API_BASE_URL=https://koola.vn/api"
            echo "NEXT_PUBLIC_SITE_URL=https://koola.vn"
            echo "API_BASE_URL_SERVER=http://api:4000"
            echo "NEXT_PUBLIC_GA_MEASUREMENT_ID=G-Q1HY3MEZPC"
          } > apps/web/.env.production

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: production
          push: true
          tags: |
            ${{ env.IMAGE_API }}:latest
            ${{ env.IMAGE_API }}:${{ github.sha }}

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: |
            ${{ env.IMAGE_WEB }}:latest
            ${{ env.IMAGE_WEB }}:${{ github.sha }}

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 30 -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Test SSH connection
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p ${{ secrets.VPS_PORT }} \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "echo 'SSH connection OK'"

      - name: Rsync config files to VPS
        # Chỉ copy những file cần thiết để chạy — không copy source code hay build artifacts
        run: |
          rsync -az \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.VPS_PORT }} -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=15" \
            docker-compose.production.yml \
            nginx/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_PROJECT_PATH }}/
          rsync -az \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.VPS_PORT }} -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=15" \
            migrations/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_PROJECT_PATH }}/migrations/

      - name: Rsync seed images to VPS
        # Non-fatal: seed images are optional, site works without them.
        continue-on-error: true
        run: |
          rsync -az \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.VPS_PORT }} -o StrictHostKeyChecking=no -o ConnectTimeout=30 -o ServerAliveInterval=15" \
            apps/web/public/blog/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_PROJECT_PATH }}/seed-images/

      - name: Deploy on VPS
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -p ${{ secrets.VPS_PORT }} \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=15 \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << ENDSSH
          set -e
          cd "${{ secrets.VPS_PROJECT_PATH }}"

          echo "Step 1: Stop old containers to free image references..."
          docker rm -f koola-api-prod koola-web-prod koola-nginx-prod koola-cloudflared 2>/dev/null || true
          # Keep postgres running to preserve data volume
          docker network rm koola-production-network 2>/dev/null || true

          echo "Step 2: Free disk space (remove unused images)..."
          docker image prune -af
          df -h /

          echo "Step 3: Login to GHCR..."
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

          echo "Step 4: Pull new images..."
          docker pull "${{ env.IMAGE_API }}:${{ github.sha }}"
          docker pull "${{ env.IMAGE_WEB }}:${{ github.sha }}"

          echo "Step 5: Stop postgres and start full stack..."
          docker rm -f koola-postgres-prod 2>/dev/null || true
          KOOLA_API_IMAGE="${{ env.IMAGE_API }}:${{ github.sha }}" \
          KOOLA_WEB_IMAGE="${{ env.IMAGE_WEB }}:${{ github.sha }}" \
            docker compose -f docker-compose.production.yml --env-file .env.production.local up -d --remove-orphans

          echo "Step 6: Injecting seed images into uploads volume..."
          SEED_DIR=seed-images
          API_CTR=\$(docker ps --filter "name=koola-api-prod" --format "{{.ID}}" | head -1)
          if [ -n "\$API_CTR" ] && [ -d "\$SEED_DIR" ]; then
            docker exec "\$API_CTR" mkdir -p /app/uploads/media
            for img in "\$SEED_DIR"/*; do
              fname=\$(basename "\$img")
              docker cp "\$img" "\$API_CTR:/app/uploads/media/\$fname" && echo "  cp \$fname OK" || echo "  cp \$fname FAILED"
            done
          else
            echo "  ! Skipped: container not found or seed-images/ missing"
          fi

          echo "Step 7: Running DB migrations..."
          sleep 5
          PG_CTR=\$(docker ps --filter "name=koola-postgres-prod" --format "{{.ID}}" | head -1)
          if [ -n "\$PG_CTR" ]; then
            for f in migrations/0*.sql; do
              echo "  -> \$f"
              docker exec -i "\$PG_CTR" psql -U koola_user -d koola_db < "\$f" 2>&1 | grep -v '^\$' || true
            done
            echo "  v Migrations done"
          else
            echo "  ! WARNING: postgres not found, skipping migrations"
          fi

          echo "=== Deployment complete! ==="
          df -h /
          docker ps --format 'table {{.Names}}\t{{.Status}}'
          ENDSSH


      - name: Report result
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "Deploy OK - ${{ github.sha }} by ${{ github.actor }}"
          else
            echo "Deploy FAILED - ${{ github.sha }} - check log above"
          fi
