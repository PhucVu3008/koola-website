# =============================================================================
# nginx/nginx.conf
# Nginx reverse proxy cho koola.vn
#
# Kiến trúc:
#   koola.vn        → Next.js (container: koola-web:3000)
#   koola.vn/api/*  → Fastify API (container: koola-api:4000)  [stripped /api prefix]
#   koola.vn/uploads/* → Fastify API (container: koola-api:4000)
# =============================================================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;

    # =========================================================================
    # Docker internal DNS resolver
    # Bắt buộc để nginx resolve lại hostname khi container được recreate.
    # 127.0.0.11 là DNS server nội bộ của Docker.
    # valid=10s: re-resolve mỗi 10 giây — tránh cache IP cũ sau khi rebuild.
    # =========================================================================
    resolver 127.0.0.11 valid=10s ipv6=off;

    # =========================================================================
    # Server block: koola.vn (HTTP — Cloudflare Tunnel sẽ handle HTTPS)
    # =========================================================================
    server {
        listen 80;
        server_name koola.vn www.koola.vn localhost;

        # Max upload size (phải khớp với MAX_FILE_SIZE trong API)
        client_max_body_size 10M;

        # ------------------------------------------------------------------
        # QUAN TRỌNG: set $upstream dùng variable để kích hoạt dynamic DNS.
        # Khi proxy_pass dùng literal hostname, nginx cache IP lúc startup.
        # Khi dùng variable, nginx re-resolve qua resolver mỗi 10s.
        # Để URI được forward đúng, dùng $request_uri (không modify path).
        # ------------------------------------------------------------------

        # ------------------------------------------------------------------
        # /api/* → Fastify API — strip /api prefix trước khi forward
        # Dùng rewrite để bỏ /api prefix, sau đó proxy_pass chỉ hostname.
        # ------------------------------------------------------------------
        location /api/ {
            set $api_upstream http://api:4000;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass         $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # ------------------------------------------------------------------
        # /uploads/* → Fastify API (giữ nguyên path /uploads/*)
        # ------------------------------------------------------------------
        location /uploads/ {
            set $api_upstream http://api:4000;
            proxy_pass         $api_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            add_header         Cache-Control "public, max-age=604800";
        }

        # ------------------------------------------------------------------
        # Next.js image optimization — no Cloudflare cache (dynamic per-size)
        # ------------------------------------------------------------------
        location /_next/image {
            set $web_upstream http://web:3000;
            proxy_pass         $web_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_no_cache     1;
            proxy_cache_bypass 1;
            # Tell Cloudflare NOT to cache image optimizer responses.
            # The browser still caches via its own heuristics.
            add_header Cache-Control "public, max-age=86400, s-maxage=0";
        }

        # ------------------------------------------------------------------
        # Next.js static assets with content hash — safe to cache forever.
        # These files are immutable: hash changes every build.
        # ------------------------------------------------------------------
        location /_next/static/ {
            set $web_upstream http://web:3000;
            proxy_pass         $web_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_no_cache     1;
            proxy_cache_bypass 1;
            # Safe: filename hash changes on every build.
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # ------------------------------------------------------------------
        # Other /_next/ paths (RSC, HMR, etc.) — never cache
        # ------------------------------------------------------------------
        location /_next/ {
            set $web_upstream http://web:3000;
            proxy_pass         $web_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_no_cache     1;
            proxy_cache_bypass 1;
            add_header Cache-Control "no-store";
        }

        # ------------------------------------------------------------------
        # /api-docs* → Fastify API (Swagger UI)
        # ------------------------------------------------------------------
        location /api-docs {
            set $api_upstream http://api:4000;
            proxy_pass         $api_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
        }

        # ------------------------------------------------------------------
        # Tất cả requests còn lại → Next.js (giữ nguyên path)
        # HTML pages phải KHÔNG được cache bởi Cloudflare — nếu Cloudflare
        # cache HTML cũ, browser sẽ nhận link chunk JS cũ → 404.
        # ------------------------------------------------------------------
        location / {
            set $web_upstream http://web:3000;
            proxy_pass         $web_upstream$request_uri;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            # Prevent Cloudflare from caching HTML — chunk hashes change per build.
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }
}
