# =============================================================================
# .github/workflows/deploy.yml
#
# CI/CD Pipeline: Build trên GitHub Actions → Deploy lên VPS
#
# Flow:
#   1. Push code lên GitHub (branch main)
#   2. GitHub Actions: build API (tsc) + build Next.js standalone (Linux runner)
#   3. Nén artifacts → scp sang VPS
#   4. VPS: giải nén → docker compose build (COPY only) → up -d
#
# Secrets cần thêm tại:
#   GitHub → Settings → Secrets and variables → Actions
#   - VPS_SSH_PRIVATE_KEY : nội dung ~/.ssh/koola_cicd
#   - VPS_HOST            : 14.224.233.11
#   - VPS_PORT            : 5555
#   - VPS_USER            : koola
#   - VPS_PROJECT_PATH    : /home/koola/koola-website
# =============================================================================

name: 🚀 Build & Deploy to Production VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: 🔨 Build (API + Web)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔨 Build API (TypeScript)
        run: npm run build --workspace=apps/api

      - name: 🔨 Build Next.js standalone
        run: npm run build --workspace=apps/web
        env:
          NEXT_PUBLIC_API_BASE_URL: https://koola.vn/api
          NEXT_PUBLIC_SITE_URL: https://koola.vn
          API_BASE_URL_SERVER: http://localhost:4000

      - name: 📝 Create .env.production
        run: |
          printf 'NODE_ENV=production\nNEXT_PUBLIC_API_BASE_URL=https://koola.vn/api\nNEXT_PUBLIC_SITE_URL=https://koola.vn\nAPI_BASE_URL_SERVER=http://api:4000\n' > apps/web/.env.production

      - name: 📦 Package artifacts
        run: |
          tar -czf build-artifacts.tar.gz \
            apps/api/dist \
            apps/web/.next/standalone \
            apps/web/.next/static \
            apps/web/public \
            apps/web/.env.production \
            package.json \
            package-lock.json \
            apps/api/package.json \
            apps/web/package.json
          echo "Artifact size: $(du -sh build-artifacts.tar.gz | cut -f1)"

      - name: 📤 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: build-artifacts.tar.gz
          retention-days: 3

  deploy:
    name: 🚀 Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📥 Download artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: 🔑 Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: 📤 Rsync source to VPS
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.VPS_PORT }} -o StrictHostKeyChecking=no" \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='apps/web/.next' \
            --exclude='apps/api/dist' \
            --exclude='apps/web/node_modules' \
            --exclude='apps/api/node_modules' \
            --exclude='.env*' \
            --exclude='uploads' \
            --exclude='*.tar.gz' \
            ./ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_PROJECT_PATH }}/

      - name: 📤 Copy artifact to VPS
        run: |
          scp -i ~/.ssh/deploy_key \
            -P ${{ secrets.VPS_PORT }} \
            -o StrictHostKeyChecking=no \
            build-artifacts.tar.gz \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_PROJECT_PATH }}/

      - name: 🐳 Deploy on VPS
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p ${{ secrets.VPS_PORT }} \
            -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "set -e && \
             cd ${{ secrets.VPS_PROJECT_PATH }} && \
             echo '[1/4] Extracting artifacts...' && \
             tar -xzf build-artifacts.tar.gz && \
             rm -f build-artifacts.tar.gz && \
             echo '[2/4] Building Docker images...' && \
             docker compose -f docker-compose.production.yml --env-file .env.production.local build --no-cache api web && \
             echo '[3/4] Restarting containers...' && \
             docker compose -f docker-compose.production.yml --env-file .env.production.local up -d --remove-orphans && \
             echo '[4/4] Pruning old images...' && \
             docker image prune -f && \
             echo 'Done!' && \
             docker ps --format 'table {{.Names}}\t{{.Status}}'"

      - name: ✅ Success
        if: success()
        run: echo "Deploy OK — ${{ github.sha }} by ${{ github.actor }}"

      - name: ❌ Failure
        if: failure()
        run: echo "Deploy FAILED — ${{ github.sha }} — check Actions log"
