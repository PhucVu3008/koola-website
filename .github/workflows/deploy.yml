name: Build and Deploy to Production VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build API and Web
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Build API
        run: npm run build --workspace=apps/api

      - name: Build Next.js
        run: npm run build --workspace=apps/web
        env:
          NEXT_PUBLIC_API_BASE_URL: https://koola.vn/api
          NEXT_PUBLIC_SITE_URL: https://koola.vn
          API_BASE_URL_SERVER: http://localhost:4000

      - name: Create env file for Docker
        run: |
          printf 'NODE_ENV=production\nNEXT_PUBLIC_API_BASE_URL=https://koola.vn/api\nNEXT_PUBLIC_SITE_URL=https://koola.vn\nAPI_BASE_URL_SERVER=http://api:4000\n' > apps/web/.env.production
          cat apps/web/.env.production

      - name: Package artifacts
        run: |
          tar -czf build-artifacts.tar.gz \
            apps/api/dist \
            apps/web/.next/standalone \
            apps/web/.next/static \
            apps/web/public \
            apps/web/.env.production \
            package.json \
            package-lock.json \
            apps/api/package.json \
            apps/web/package.json
          du -sh build-artifacts.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: build-artifacts.tar.gz
          retention-days: 3

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "SSH key fingerprint:"
          ssh-keygen -lf ~/.ssh/deploy_key

      - name: Test SSH connection
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p ${{ secrets.VPS_PORT }} \
            -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "echo 'SSH connection OK'"

      - name: Rsync source to VPS
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.VPS_PORT }} -o StrictHostKeyChecking=no" \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='apps/web/.next' \
            --exclude='apps/api/dist' \
            --exclude='apps/web/node_modules' \
            --exclude='apps/api/node_modules' \
            --exclude='.env*' \
            --exclude='uploads' \
            --exclude='*.tar.gz' \
            --exclude='apps/web/public' \
            ./ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_PROJECT_PATH }}/

      - name: Copy artifact to VPS
        run: |
          scp \
            -i ~/.ssh/deploy_key \
            -P ${{ secrets.VPS_PORT }} \
            -o StrictHostKeyChecking=no \
            build-artifacts.tar.gz \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_PROJECT_PATH }}/

      - name: Deploy on VPS
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -p ${{ secrets.VPS_PORT }} \
            -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "set -e && \
             cd ${{ secrets.VPS_PROJECT_PATH }} && \
             echo 'Step 1: Free disk space (prune build cache)...' && \
             docker builder prune -af && \
             docker image prune -f && \
             df -h / && \
             echo 'Step 2: Extracting artifacts...' && \
             tar -xzf build-artifacts.tar.gz && \
             rm -f build-artifacts.tar.gz && \
             echo 'Step 3: Building Docker images...' && \
             docker compose -f docker-compose.production.yml --env-file .env.production.local build api web && \
             echo 'Step 4: Restarting containers...' && \
             docker compose -f docker-compose.production.yml --env-file .env.production.local up -d --remove-orphans && \
             echo 'Step 5: Pruning old images...' && \
             docker image prune -f && \
             echo 'Deployment complete!' && \
             df -h / && \
             docker ps --format 'table {{.Names}}\t{{.Status}}'"

      - name: Report result
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "Deploy OK - ${{ github.sha }} by ${{ github.actor }}"
          else
            echo "Deploy FAILED - ${{ github.sha }} - check log above"
          fi
